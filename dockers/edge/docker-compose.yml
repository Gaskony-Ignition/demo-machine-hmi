# A throwaway Ignition EDGE gateway for this demo, and nothing else.
#
# It exists because the Edge claim in the README was never measured: docs/
# CONTRACT.md says in writing that the project "has never run against a real
# Edge Panel gateway". This is that gateway.
#
# Explicit project name -- without it Compose uses the DIRECTORY name (`edge`),
# which is generic enough to collide with another stack's container.
name: machinehmi-edge

services:
  edge:
    image: inductiveautomation/ignition:8.3.8
    container_name: machinehmi-edge
    ports:
      - "8388:8088"
      - "8389:8043"
    volumes:
      - edge-data:/usr/local/bin/ignition/data
    environment:
      - ACCEPT_IGNITION_EULA=Y
      - GATEWAY_ADMIN_USERNAME=admin
      - GATEWAY_ADMIN_PASSWORD=password
      # See modules/dockers/ignition/docker-compose.yml: glibc hands a process up
      # to 8 x cores malloc arenas and Ignition spreads ~220 threads across all of
      # them, so RSS runs far above the heap. Capping arenas is the saving.
      - MALLOC_ARENA_MAX=2
    command: >
      -n machinehmi-edge
      -m 1024
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/StatusPing"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

volumes:
  edge-data:
